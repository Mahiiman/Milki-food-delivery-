name: MILKI FOOD DELIVERY Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    env:
      MILKI_ANDROID_KEYSTORE_BASE64: ${{ secrets.MILKI_RELEASE_KEYSTORE_BASE64 }}
      MILKI_RELEASE_STORE_PASSWORD: ${{ secrets.MILKI_RELEASE_KEYSTORE_PASSWORD }}
      MILKI_RELEASE_KEY_ALIAS: ${{ secrets.MILKI_RELEASE_KEY_ALIAS }}
      MILKI_RELEASE_KEY_PASSWORD: ${{ secrets.MILKI_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare release signing key
        id: signing
        shell: bash
        run: |
          set +e
          if [ -z "$MILKI_ANDROID_KEYSTORE_BASE64" ] || [ -z "$MILKI_RELEASE_STORE_PASSWORD" ] || [ -z "$MILKI_RELEASE_KEY_ALIAS" ] || [ -z "$MILKI_RELEASE_KEY_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are incomplete; debug APK can still be built."
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/milki-release.jks"
          if ! printf '%s' "$MILKI_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"; then
            rm -f "$KEYSTORE"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Keystore Base64 is invalid; debug APK can still be built."
            exit 0
          fi
          if ! keytool -list -keystore "$KEYSTORE" -storepass "$MILKI_RELEASE_STORE_PASSWORD" -alias "$MILKI_RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            rm -f "$KEYSTORE"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Keystore, password, or alias is invalid; debug APK can still be built."
            exit 0
          fi
          echo "MILKI_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Signed Release APK
        if: ${{ steps.signing.outputs.ready == 'true' }}
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload Signed Release APK
        if: ${{ steps.signing.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: MILKI-FOOD-DELIVERY-Signed-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MILKI-FOOD-DELIVERY-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
